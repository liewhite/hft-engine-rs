[package]
name = "hft-engine-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"

# Ethereum signing (for Hyperliquid EIP-712)
alloy = { version = "1.0", features = ["signers", "signer-local"] }

# MessagePack serialization (for Hyperliquid action hash)
rmp-serde = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL parsing
url = "2"

# Config parsing
toml = "0.8"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Decimal for precise financial calculations
rust_decimal = "1"
rust_decimal_macros = "1"

# 回测: 插入序挂单簿 (撮合按到达顺序 = 时间优先) + 历史数据 zip 解压
indexmap = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[[bin]]
name = "paper_trade"
path = "src/bin/paper_trade.rs"

[dev-dependencies]
log = "0.4"
# 测试用暂停时钟（tokio::test(start_paused)）——keepalive/空闲检测测试无需真实等待
tokio = { version = "1", features = ["full", "test-util"] }
# 测试里把 mpsc 接收端包成 Stream 喂给 WS 读循环
tokio-stream = "0.1"

[[bin]]
name = "funding_arb"
path = "src/bin/funding_arb.rs"

# Linux 部署包静态链接 OpenSSL（vendored）：本地交叉编译不需要目标机的 openssl 头文件，
# 产物也不依赖目标机的 libssl 版本。只作用于 Linux 目标，本机 macOS 构建不受影响。
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
